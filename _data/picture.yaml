presets:
  thumb:
    formats: [webp, jpg]
    widths: [320, 480, 640, 800]
    size: "(min-width: 1200px) 360px, (min-width: 768px) 45vw, 92vw"
    dimension_attributes: true
    format_quality:
      webp: 85
      jpg: 85
    attributes:
      class: thumb
      loading: lazy
      decoding: async

  full:
    formats: [webp, jpg]
    widths: [960, 1280, 1920]
    size: "90vw"
    dimension_attributes: true
    format_quality:
      webp: 90
      jpg: 90
    attributes:
      decoding: async

  hero:
    formats: [webp, jpg]
    widths: [360, 400, 640, 720, 800, 1200, 1600]
    size: "(min-width: 1200px) 560px, (min-width: 900px) 45vw, 92vw"
    dimension_attributes: true
    format_quality:
      webp: 90
      jpg: 90
    attributes:
      loading: eager
      fetchpriority: high
      decoding: async
