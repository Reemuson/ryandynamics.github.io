presets:
  thumb:
    formats: [webp, jpg]
    widths: [360, 540, 720, 960]
    size: "(min-width: 1200px) 360px, (min-width: 768px) 45vw, 92vw"
    dimension_attributes: true
    format_quality:
      webp: 78
      jpg: 82
    attributes:
      class: thumb
      loading: lazy
      decoding: async

  full:
    formats: [webp, jpg]
    widths: [960, 1280, 1920]
    size: "90vw"
    dimension_attributes: true
    format_quality:
      webp: 82
      jpg: 86
    attributes:
      decoding: async

  hero:
    formats: [webp, jpg]
    widths: [640, 960, 1200, 1600]
    size: "(min-width: 1200px) 560px, (min-width: 900px) 45vw, 96vw"
    dimension_attributes: true
    format_quality:
      webp: 82
      jpg: 86
    attributes:
      loading: eager
      fetchpriority: high
      decoding: async
