<!doctype html>
<html lang="en-US">
<meta charset="utf-8">
<title>Redirecting…</title>

<!-- Prevent indexing, still allow link flow -->
<meta name="robots" content="noindex, follow">

<!-- Absolute canonical to the target -->
<link rel="canonical" href="{{ page.redirect.to | absolute_url | escape }}">

<!-- Meta refresh as a fallback -->
<meta http-equiv="refresh" content="0; url={{ page.redirect.to | absolute_url | uri_escape }}">

<!-- JS redirect without confusing the linter -->
<script>
	(function () {
		var target = '{{ page.redirect.to | absolute_url | escape }}';
		if (target) location.replace(target);
	})();
</script>

<p>If the page does not redirect, <a href="{{ page.redirect.to | absolute_url | escape }}">use this link</a>.</p>

</html>
