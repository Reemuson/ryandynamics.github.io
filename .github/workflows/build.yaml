name: Build & Deploy Jekyll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for last-modified)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install libvips (with AVIF support)
        run: |
          sudo apt-get update
          # libvips runtime + CLI tools
          sudo apt-get install -y libvips libvips-tools
          # AVIF via libheif (and dependencies)
          sudo apt-get install -y libheif1 libheif-dev
          # (optional) JPEG XL support if your presets ever use it
          sudo apt-get install -y libjxl-dev || true
          vips --version

      - name: Install gems
        run: bundle install --path vendor/bundle

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
